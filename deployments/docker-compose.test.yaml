version: "3.8"

services:
  test-db:
    image: postgres:14
    container_name: hensai-kun-test-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hensai-kun_test
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  postgres-test-data:
